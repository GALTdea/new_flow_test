<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Request cannot be processed</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { display: grid; min-width: 20rem; min-height: 100vh; margin: 0; color: #17312f; background: #f5f7f5; place-items: center; }
      main { width: min(100% - 3rem, 38rem); padding: clamp(1.5rem, 6vw, 3rem); background: #ffffff; border: 1px solid #d6e0dc; border-radius: 0.75rem; }
      .status { margin: 0 0 0.75rem; color: #0d5c59; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: -0.03em; line-height: 1; }
      p { max-width: 36rem; color: #45615d; font-size: 1.125rem; line-height: 1.55; }
      a { display: inline-block; margin-top: 0.5rem; color: #ffffff; font-weight: 700; text-decoration: none; background: #0d5c59; border-radius: 0.5rem; padding: 0.75rem 1rem; }
      a:hover { background: #083f3d; }
      a:focus-visible { outline: 0.2rem solid #df8a43; outline-offset: 0.2rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="status">422</p>
      <h1>Request cannot be processed</h1>
      <p>We could not complete that request. Please return to the home page and try again.</p>
      <a href="/">Return to the home page</a>
    </main>
  </body>
</html>
